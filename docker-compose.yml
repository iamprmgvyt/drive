version: '3.8'
services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: drive
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # redis optional for nonce cache
  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
